name: nodic
services:
  app:
    profiles: ['dev']
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://nodic:nodic_local@postgres:5432/nodic
      HOST: 0.0.0.0
      PORT: 3001
      VITE_HOST: 0.0.0.0
      PUBLIC_ORIGIN: http://127.0.0.1:5173
    ports:
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nodic
      POSTGRES_PASSWORD: nodic_local
      POSTGRES_DB: nodic
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - nodic_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodic -d nodic']
      interval: 2s
      timeout: 5s
      retries: 20
networks:
  default:
    ipam:
      config:
        - subnet: '${NODIC_SUBNET:-172.29.240.0/24}'
volumes:
  nodic_postgres:
