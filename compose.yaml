name: nodic
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nodic
      POSTGRES_PASSWORD: nodic_local
      POSTGRES_DB: nodic
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - nodic_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodic -d nodic']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  nodic_postgres:
